<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">
        <span class="icon">🔍</span>
        Tech Detector
      </h1>
      <div class="url-info">
        <span class="url-text" id="currentUrl">Analyzing...</span>
      </div>
    </header>

    <div class="content">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Detecting technologies...</p>
      </div>

      <div class="results" id="results" style="display: none;">
        <div class="stats">
          <div class="stat">
            <span class="stat-number" id="totalCount">0</span>
            <span class="stat-label">Technologies</span>
          </div>
          <div class="stat">
            <span class="stat-number" id="categoryCount">0</span>
            <span class="stat-label">Categories</span>
          </div>
        </div>

        <div class="technologies-list" id="technologiesList">
          <!-- Technologies will be populated here -->
        </div>

        <div class="no-results" id="noResults" style="display: none;">
          <div class="no-results-icon">🔍</div>
          <h3>No technologies detected</h3>
          <p>This page might be using custom or unrecognized technologies.</p>
        </div>
      </div>

      <div class="error" id="error" style="display: none;">
        <div class="error-icon">⚠️</div>
        <h3>Analysis failed</h3>
        <p id="errorMessage">Unable to analyze this page.</p>
        <button class="retry-btn" id="retryBtn">Try Again</button>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-info">
        <span class="version">v1.0.0</span>
        <span class="separator">•</span>
        <span class="timestamp" id="timestamp"></span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
